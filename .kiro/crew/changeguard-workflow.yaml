# ChangeGuard AI — Stage A (Review) of the two-stage Kiro Crew 0.2.0 DAG.
#
# WHY TWO STAGES (see design.md's "Kiro Crew 0.2.0 Orchestration Mapping"
# for the full writeup): `kiro_crew/task_planner.py::decompose_yaml()` has
# no conditional-skip / branching primitive — every node in a single YAML
# file's DAG always runs once its dependencies are satisfied, with no way
# to make a downstream node's execution conditional on an upstream node's
# *data* outcome (only on its pass/fail *task* outcome). A single-file DAG
# containing both review and remediation nodes would therefore force a
# fully SAFE (PASS+PASS) candidate to still reach the human-approval-gated
# `remediation` task, contradicting the requirement that a safe candidate
# must reach SAFE_TO_SHIP without ever pausing for approval or invoking
# the Remediator.
#
# ChangeGuard resolves this the same way Crew's own `plan`/`execute` REST
# split is designed to be used: this file is Stage A, decomposed and
# executed on its own via `POST /api/taskrunner/plan` (source: yaml,
# agent: crew-runner) then `POST /api/taskrunner/{task_id}/execute`.
# `scripts/changeguard_launch.py` inspects the *filesystem* result of this
# stage (`artifacts/change-blocked-result.json` present or absent — never
# a Crew API call) to decide, entirely outside of Crew's own DAG
# semantics, whether to plan and execute Stage B
# (`.kiro/crew/changeguard-workflow-remediation.yaml`) at all. A safe
# candidate simply never has Stage B planned, let alone executed — no
# `remediation` task object exists at all in that run, so there is nothing
# for `force_approval` to gate and nothing for a human to approve.
#
# IMPORTANT — CONFIRMED EXECUTION SEMANTICS (see design.md's "Kiro Crew
# 0.2.0 Orchestration Mapping" for the full live-probe writeup): a live
# semantics probe against the installed kirocrew 0.2.0/kiro-cli 2.18.1
# confirmed that `decompose_yaml()` folds a node's `prompt:`/`shell:` text
# verbatim into `Task.description` — there is no `Task.shell` field and no
# code path in `task_executor.py`/`taskrunner.py` that runs that text as a
# literal, deterministic subprocess. Every task, regardless of which YAML
# key is used, is executed as one LLM/ACP chat turn
# (`client.stream(full_prompt)`) against the run-scoped Kiro CLI agent —
# in this workflow, always `crew-runner` (see "Kiro Crew 0.2.0
# Orchestration Mapping" and `scripts/changeguard_launch.py` for how the
# `agent` field is supplied on both the plan and execute calls). This file
# therefore uses `prompt:` rather than `shell:` (both keys are accepted by
# decompose_yaml() and are folded identically — `prompt:` is used here
# only so this repository does not misleadingly suggest literal,
# Crew-owned shell execution), and every node's prompt text explicitly
# instructs the `crew-runner` agent to "Execute exactly this command and
# no other command," with the command itself kept fixed and
# non-interpolated. ChangeGuard's reproducibility and safety come from the
# DAG's dependency structure, the deterministic Python transport/tool
# scripts, `crew-runner`'s narrow permission allow-list (which
# independently enforces the same command restriction), fail-closed
# artifact validation, and the Gateway-backed force_approval gate — not
# from any claim that Crew executes shell text deterministically.
#
# Schema reminder (decompose_yaml() accepts EXACTLY these per-node keys —
# any other key raises a ValueError): agent, timeout, depends_on,
# description, prompt, shell. `agent:` below is a cosmetic label only —
# it is embedded into the decomposed Task's description text and is NEVER
# used to select or bind an actual executable Kiro CLI agent (confirmed
# live: an `agent: probe` value that isn't even a registered Crew agent
# name produced no error, just descriptive text). The real binding to
# security-reviewer/reliability-reviewer happens entirely inside each
# node's prompt, via `scripts/run_agent_and_save.py --agent <name>`,
# invoked by the run-scoped `crew-runner` agent (see
# `scripts/changeguard_launch.py`, which passes `agent: crew-runner` on
# both the plan and execute calls for this file).
#
# Data flow between nodes is FILE-BASED, not automatic result-injection —
# `task_executor.py::build_task_prompt()` only ever shows a dependent
# task's plan/description/dependency graph, never a predecessor's
# `Task.result` text. Every node that produces structured output writes it
# to one of these fixed artifact paths, and every dependent node's prompt
# tells the crew-runner agent to read that same fixed path explicitly:
#
#   artifacts/baseline-plan.json                       (precondition; never generated by this workflow)
#   artifacts/candidate-plan.json                       <- candidate-plan
#   artifacts/security-review-result.json               <- security-review
#   artifacts/reliability-review-result.json             <- reliability-review
#   artifacts/final-verdict.json  (early SAFE_TO_SHIP)   <- aggregate-review, when both PASS
#   artifacts/change-blocked-result.json                 <- aggregate-review, otherwise
#
# `scripts/changeguard_launch.py` deletes the stale run-specific artifacts
# in this list (never `artifacts/baseline-plan.json`, which is
# intentionally persistent) before planning Stage A, via
# `scripts/cleanup_run_artifacts.py`'s explicit allow-list — so a prior
# run's leftover `change-blocked-result.json` can never be mistaken for
# this run's outcome. `aggregate_review.py`'s own PASS branch additionally
# removes any pre-existing `change-blocked-result.json` itself, as a
# second, independent layer of the same protection.
#
# SAFETY: every node's prompt names one of the exact, fixed ChangeGuard
# commands documented in design.md/this repo's scripts — never a
# dynamically constructed or interpolated shell string, and never
# `terraform apply`/`terraform destroy`/an AWS CLI invocation/`rm -rf`.
# `crew-runner`'s own `permissions.rules` allow-list independently
# enforces the same restriction (defense in depth: the prompt's wording
# is one layer, the agent's permission config is the other), and its
# `hooks.preToolUse` carries the same validated safety_guard.py hook as
# the specialized reviewer/remediator agents.

agents:
  candidate-plan:
    agent: crew-runner
    description: >-
      Generate the Candidate Plan from the current terraform/main.tf.
      Fails closed if the Baseline Plan does not already exist — this
      workflow never generates the baseline itself (design.md's
      Baseline/Candidate/Remediated Evidence Model requires the baseline
      to come from the safe, unmodified configuration, generated once,
      out of band, before any review run).
    timeout: 300
    prompt: >-
      First execute exactly this command and no other command:
      test -f artifacts/baseline-plan.json
      If it fails (non-zero exit), report that artifacts/baseline-plan.json
      is missing and stop immediately — do not run anything else. If it
      succeeds, then execute exactly this second command and no other
      command:
      python3 scripts/run_tf_plan.py --terraform-dir terraform --output artifacts/candidate-plan.json

  security-review:
    agent: crew-runner
    description: >-
      Invoke the security-reviewer Kiro CLI agent to judge SEC-001/SEC-002
      from Baseline vs. Candidate evidence, and persist its ReviewResult.
    depends_on: [candidate-plan]
    timeout: 300
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/run_agent_and_save.py --agent security-reviewer --prompt "Compare artifacts/baseline-plan.json (the Baseline Plan) against artifacts/candidate-plan.json (the Candidate Plan). Evaluate SEC-001 and SEC-002 using exactly these two plan paths per your own instructions, then respond with ONLY your ReviewResult JSON object." --output artifacts/security-review-result.json

  reliability-review:
    agent: crew-runner
    description: >-
      Invoke the reliability-reviewer Kiro CLI agent to judge
      REL-001/BR-001 from Baseline vs. Candidate evidence, and persist its
      ReviewResult. No dependency on security-review, so Crew's own
      group_parallel_tasks()/asyncio.gather() batching runs this
      concurrently with it.
    depends_on: [candidate-plan]
    timeout: 300
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/run_agent_and_save.py --agent reliability-reviewer --prompt "Compare artifacts/baseline-plan.json (the Baseline Plan) against artifacts/candidate-plan.json (the Candidate Plan). Evaluate REL-001 and BR-001 using exactly these two plan paths per your own instructions, then respond with ONLY your ReviewResult JSON object." --output artifacts/reliability-review-result.json

  aggregate-review:
    agent: crew-runner
    description: >-
      Pure workflow-level aggregation of the two ReviewResult files —
      PASS+PASS writes artifacts/final-verdict.json (SAFE_TO_SHIP), removes
      any stale artifacts/change-blocked-result.json, and Stage A ends
      there — scripts/changeguard_launch.py will not plan Stage B at all.
      Any FAIL/INCOMPLETE/missing/malformed result writes
      artifacts/change-blocked-result.json with the union of findings,
      which is what makes scripts/changeguard_launch.py plan and execute
      Stage B. Performs no SEC/REL policy re-evaluation of its own.
    depends_on: [security-review, reliability-review]
    timeout: 60
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/aggregate_review.py --security artifacts/security-review-result.json --reliability artifacts/reliability-review-result.json --pass-output artifacts/final-verdict.json --blocked-output artifacts/change-blocked-result.json
