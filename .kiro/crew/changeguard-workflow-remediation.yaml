# ChangeGuard AI — Stage B (Approval / Remediation / Re-review) of the
# two-stage Kiro Crew 0.2.0 DAG.
#
# This file is ONLY ever planned/executed by scripts/changeguard_launch.py,
# and ONLY after Stage A (.kiro/crew/changeguard-workflow.yaml) has
# completed AND artifacts/change-blocked-result.json exists (i.e. Stage A
# did not reach SAFE_TO_SHIP on its own). See the header comment in
# .kiro/crew/changeguard-workflow.yaml for the full rationale — Crew's
# decompose_yaml() has no conditional-skip primitive, so keeping this
# stage in a separate file that is conditionally planned by the launcher
# (a decision made by inspecting a filesystem artifact, never a Crew API
# call or judgment about SEC-001/SEC-002/REL-001/BR-001) is how ChangeGuard
# guarantees a safe candidate never reaches this stage's `remediation`
# task, and therefore never reaches the human-approval gate.
#
# The `remediation` task below is the one that MUST receive
# `force_approval: true` before this stage's plan is executed.
# `scripts/changeguard_launch.py` sets that via the safe
# plan -> locate -> update -> verify -> execute sequence (see that
# script's own module docstring for the exact REST calls and the race
# condition this ordering eliminates). This file's own `agents:` mapping
# cannot express `force_approval` at all — decompose_yaml()'s allowed key
# set is exactly {agent, timeout, depends_on, description, prompt, shell}.
#
# EXECUTION SEMANTICS: same confirmed live-probe finding as Stage A (see
# .kiro/crew/changeguard-workflow.yaml's header and design.md's "Kiro Crew
# 0.2.0 Orchestration Mapping") — every node below is executed as an
# LLM/ACP chat turn against the run-scoped `crew-runner` Kiro CLI agent
# (`scripts/changeguard_launch.py` passes `agent: crew-runner` on both the
# plan and execute calls for this file), not as a literal Crew-owned
# subprocess. `prompt:` is used instead of `shell:` for the same reason as
# Stage A: both keys are folded identically by decompose_yaml(), and
# `prompt:` does not misleadingly suggest deterministic shell execution.
#
# Data flow (fixed artifact paths, same file-based mechanism as Stage A):
#
#   artifacts/change-blocked-result.json                 (read by remediation; produced by Stage A)
#   artifacts/remediation-result.json                    <- remediation; ALSO read by final-verdict
#                                                            (Phase 8B fail-closed correction: SAFE_TO_SHIP
#                                                            requires this file's status == "remediated")
#   artifacts/remediated-plan.json                       <- remediated-plan
#   artifacts/security-remediated-review-result.json     <- security-re-review
#   artifacts/reliability-remediated-review-result.json  <- reliability-re-review
#   artifacts/final-verdict.json  (authoritative)        <- final-verdict
#
# FAIL-CLOSED NOTE (Phase 8B correction, discovered via a real live
# approved-remediation run): a remediation may cause a genuine Terraform
# source mutation via apply_remediation.py BEFORE the remediator agent's
# own chat-response JSON contract fails to parse (e.g. extra trailing
# content after the intended result object). When that happens,
# ChangeGuard's `run_remediation_stage.py` now exits non-zero (so Crew's
# own DAG failure propagation blocks `remediated-plan`/the re-review
# nodes from running at all), and `final_verdict.py` independently
# requires `remediation-result.json` to report status == "remediated"
# before it will ever consider SAFE_TO_SHIP — so even if this node is
# somehow reached anyway, the workflow reports REMEDIATION_FAILED, never
# SAFE_TO_SHIP, on a remediation whose own agent-output contract failed.
# ChangeGuard does NOT automatically roll back a mutation that happened
# before a contract failure was detected — no rollback mechanism exists
# in the approved design — the invariant enforced here is narrower and
# unconditional: contract failure blocks SAFE_TO_SHIP, always.
#
# SAFETY: same fixed, non-interpolated command policy as Stage A — never
# terraform apply/destroy, never an AWS CLI call, never rm -rf, and never
# a direct invocation of scripts/apply_remediation.py by crew-runner
# itself (that script is only ever reached via
# scripts/run_remediation_stage.py -> the remediator Kiro CLI agent).
# crew-runner's own permissions.rules explicitly deny
# `python3 scripts/apply_remediation.py *` even though nothing in this
# file names it, as an independent defense-in-depth layer.

agents:
  remediation:
    agent: crew-runner
    description: >-
      GATED NODE — force_approval must already be true on this task
      (set by scripts/changeguard_launch.py via the plan/update/verify/
      execute sequence, BEFORE this stage's plan is executed) before this
      node is allowed to run at all. Reads artifacts/change-blocked-
      result.json (guaranteed to exist, since this stage is only ever
      planned when it does) and invokes the remediator Kiro CLI agent
      once per approved, supported finding, passing ONLY that finding's
      JSON — never raw plan JSON. crew-runner never calls
      scripts/apply_remediation.py directly; only
      scripts/run_remediation_stage.py (which in turn only ever invokes
      the remediator agent) may reach it.
    timeout: 600
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/run_remediation_stage.py --blocked-input artifacts/change-blocked-result.json --output artifacts/remediation-result.json --terraform-dir terraform

  remediated-plan:
    agent: crew-runner
    description: >-
      Generate the Remediated Plan from terraform/main.tf after approved
      remediation has been applied.
    depends_on: [remediation]
    timeout: 300
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/run_tf_plan.py --terraform-dir terraform --output artifacts/remediated-plan.json

  security-re-review:
    agent: crew-runner
    description: >-
      Re-invoke the security-reviewer agent to judge SEC-001/SEC-002 from
      Baseline vs. Remediated evidence.
    depends_on: [remediated-plan]
    timeout: 300
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/run_agent_and_save.py --agent security-reviewer --prompt "Compare artifacts/baseline-plan.json (the Baseline Plan) against artifacts/remediated-plan.json (the Remediated Plan). Evaluate SEC-001 and SEC-002 using exactly these two plan paths per your own instructions, then respond with ONLY your ReviewResult JSON object." --output artifacts/security-remediated-review-result.json

  reliability-re-review:
    agent: crew-runner
    description: >-
      Re-invoke the reliability-reviewer agent to judge REL-001/BR-001
      from Baseline vs. Remediated evidence. No dependency on
      security-re-review, so this runs concurrently with it.
    depends_on: [remediated-plan]
    timeout: 300
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/run_agent_and_save.py --agent reliability-reviewer --prompt "Compare artifacts/baseline-plan.json (the Baseline Plan) against artifacts/remediated-plan.json (the Remediated Plan). Evaluate REL-001 and BR-001 using exactly these two plan paths per your own instructions, then respond with ONLY your ReviewResult JSON object." --output artifacts/reliability-remediated-review-result.json

  final-verdict:
    agent: crew-runner
    description: >-
      Produce the authoritative final verdict from the post-remediation
      re-review results AND the remediation stage's own result artifact.
      SAFE_TO_SHIP only if artifacts/remediation-result.json reports
      status == "remediated" (checked first, independently of plan
      status or either reviewer — Phase 8B fail-closed correction: a real
      live run showed a failed/malformed remediation-result.json can
      coexist with an already-mutated, PASS/PASS-reviewed Terraform
      state, so that agreement alone is not proof of a successful,
      contract-compliant remediation), the remediated Terraform plan
      generation succeeded, AND both reviewers PASS. Includes the
      steering doc's SAFE_TO_SHIP scope-limitation sentence.
    depends_on: [security-re-review, reliability-re-review, remediation]
    timeout: 60
    prompt: >-
      Execute exactly this command and no other command:
      python3 scripts/final_verdict.py --security artifacts/security-remediated-review-result.json --reliability artifacts/reliability-remediated-review-result.json --plan-status success --remediation-result artifacts/remediation-result.json --output artifacts/final-verdict.json
